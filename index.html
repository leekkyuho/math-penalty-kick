<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수학 승부차기</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
 <div id="view">
  <!-- layer 1: sky + stadium artwork -->
  <svg id="sceneBg" class="layer" viewBox="0 0 2752 1536" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    <defs>
      <image id="bgImg" href="assets/images/bg.jpg" x="0" y="0" width="2752" height="1536" preserveAspectRatio="none"/>
      <linearGradient id="skyExt" gradientUnits="userSpaceOnUse" x1="0" y1="-1500" x2="0" y2="0"><stop offset="0" stop-color="#3f8fdc"/><stop offset=".6" stop-color="#7cbcf2"/><stop offset="1" stop-color="#a1d3ff"/></linearGradient>
      <radialGradient id="puff" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".55" stop-color="#ffffff" stop-opacity=".75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
    </defs>
    <rect x="-4000" y="-4000" width="10752" height="4004" fill="url(#skyExt)"/>
    <g id="skyClouds"></g>
    <use href="#bgImg" transform="matrix(-1 0 0 1 1 0)"/>
    <use href="#bgImg" transform="matrix(-1 0 0 1 5503 0)"/>
    <use href="#bgImg"/>
  </svg>
  <!-- layer 2: the crowd in the stands (canvas, masked to the seats) -->
  <canvas id="crowd" class="layer" aria-hidden="true"></canvas>
  <!-- layer 3: everything in front of the stands -->
  <svg id="scene" class="layer" viewBox="0 0 2752 1536" preserveAspectRatio="xMidYMid meet" aria-label="승부차기 경기장">
    <defs>
      <image id="kBodyImg" href="assets/images/k_body.png" x="1324" y="686" width="295" height="436"/>
      <image id="kArmLImg" href="assets/images/k_armL.png" x="1361" y="889" width="76" height="79"/>
      <image id="kArmRImg" href="assets/images/k_armR.png" x="1569" y="896" width="104" height="78"/>
      <image id="ballImg" href="assets/images/ball.png" x="-116" y="-116" width="232" height="232"/>
      <radialGradient id="ballShade" cx=".38" cy=".32" r=".72"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#1a1030" stop-opacity=".38"/></radialGradient>
      <radialGradient id="flash" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".45" stop-color="#fff6c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
      <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff59a"/><stop offset=".55" stop-color="#ffd21f"/><stop offset="1" stop-color="#ffb300"/></linearGradient>
      <linearGradient id="gWhite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ead9ff"/></linearGradient>
      <linearGradient id="gCyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9f4ff"/><stop offset="1" stop-color="#4fbff2"/></linearGradient>
      <linearGradient id="gMint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8f5dc"/></linearGradient>
      <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
      <!-- face retouch materials (sprite-local coordinates) -->
      <radialGradient id="rSoft" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".62" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
      <mask id="mSoft" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#rSoft)"/></mask>
      <linearGradient id="skMouth" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="214" y2="0"><stop offset="0" stop-color="#9e7256"/><stop offset=".35" stop-color="#a87558"/><stop offset=".6" stop-color="#b97f5c"/><stop offset=".8" stop-color="#c98a63"/><stop offset="1" stop-color="#d8986c"/></linearGradient>
      <linearGradient id="skBrowL" gradientUnits="userSpaceOnUse" x1="134" y1="0" x2="178" y2="0"><stop offset="0" stop-color="#93705f"/><stop offset=".5" stop-color="#ad8370"/><stop offset="1" stop-color="#d49c79"/></linearGradient>
      <linearGradient id="skBrowR" gradientUnits="userSpaceOnUse" x1="188" y1="0" x2="246" y2="0"><stop offset="0" stop-color="#f1ad80"/><stop offset=".4" stop-color="#fcc391"/><stop offset=".75" stop-color="#fdc995"/><stop offset="1" stop-color="#e6b68b"/></linearGradient>
      <linearGradient id="skLidL" gradientUnits="userSpaceOnUse" x1="136" y1="0" x2="175" y2="0"><stop offset="0" stop-color="#8f6c5f"/><stop offset="1" stop-color="#a97b65"/></linearGradient>
      <linearGradient id="skLidR" gradientUnits="userSpaceOnUse" x1="192" y1="0" x2="236" y2="0"><stop offset="0" stop-color="#c48b67"/><stop offset="1" stop-color="#d59c74"/></linearGradient>
      <linearGradient id="skCheekL" gradientUnits="userSpaceOnUse" x1="136" y1="0" x2="175" y2="0"><stop offset="0" stop-color="#ad7962"/><stop offset="1" stop-color="#cc8f70"/></linearGradient>
      <linearGradient id="skCheekR" gradientUnits="userSpaceOnUse" x1="192" y1="0" x2="236" y2="0"><stop offset="0" stop-color="#f6b785"/><stop offset="1" stop-color="#ffc893"/></linearGradient>
      <clipPath id="eyeL"><ellipse cx="155" cy="119.5" rx="18.5" ry="14.5"/></clipPath>
      <clipPath id="eyeR"><ellipse cx="213.5" cy="121" rx="19.5" ry="14.5"/></clipPath>
      <!-- stadium atmosphere -->
      <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffef4" stop-opacity=".95"/><stop offset=".18" stop-color="#fff7d6" stop-opacity=".55"/><stop offset=".5" stop-color="#ffefc0" stop-opacity=".16"/><stop offset="1" stop-color="#ffefc0" stop-opacity="0"/></radialGradient>
      <linearGradient id="flareH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
      <linearGradient id="beamG" gradientUnits="userSpaceOnUse" x1="0" y1="200" x2="0" y2="1300"><stop offset="0" stop-color="#fffbe6" stop-opacity=".2"/><stop offset=".55" stop-color="#fffbe6" stop-opacity=".06"/><stop offset="1" stop-color="#fffbe6" stop-opacity="0"/></linearGradient>
      <radialGradient id="flashG" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#eaf4ff" stop-opacity=".7"/><stop offset="1" stop-color="#cfe6ff" stop-opacity="0"/></radialGradient>
      <linearGradient id="ledPanel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d1630"/><stop offset=".5" stop-color="#060b1a"/><stop offset="1" stop-color="#0a1226"/></linearGradient>
      <pattern id="ledGrid" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H8M0 0V8" stroke="#02040b" stroke-width="2.6" fill="none"/></pattern>
      <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="#ffffff" fill-opacity=".05"/></pattern>
      <filter id="ledBlur" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
      <clipPath id="ledClipL"><rect x="-408" y="941" width="816" height="104"/></clipPath>
      <clipPath id="ledClipR"><rect x="2398" y="941" width="708" height="104"/></clipPath>
      <linearGradient id="browInk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55331f"/><stop offset="1" stop-color="#2a170d"/></linearGradient>
    </defs>

    <g id="world">

      <!-- floodlight shafts -->
      <g id="beams" style="mix-blend-mode:screen">
        <polygon points="440,215 492,215 1420,1300 640,1300" fill="url(#beamG)"/>
        <polygon points="2258,215 2310,215 2120,1300 1340,1300" fill="url(#beamG)"/>
      </g>

      <!-- LED perimeter boards (left + right, continuing into the mirrored edges) -->
      <g id="leds" font-family="Arial Black, Arial Rounded MT Bold, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="900">
        <g>
          <rect x="-408" y="939" width="816" height="108" fill="url(#ledPanel)"/>
          <g clip-path="url(#ledClipL)"><g class="ledRun" data-y="1016" data-speed="70"></g><rect x="-408" y="941" width="816" height="104" fill="url(#ledGrid)" opacity=".55"/></g>
          <rect x="-408" y="937" width="816" height="4" fill="#9fb2d6"/><rect x="-408" y="1045" width="816" height="4" fill="#2a3552"/>
        </g>
        <g>
          <rect x="2398" y="939" width="708" height="108" fill="url(#ledPanel)"/>
          <g clip-path="url(#ledClipR)"><g class="ledRun" data-y="1016" data-speed="70"></g><rect x="2398" y="941" width="708" height="104" fill="url(#ledGrid)" opacity=".55"/></g>
          <rect x="2398" y="937" width="708" height="4" fill="#9fb2d6"/><rect x="2398" y="1045" width="708" height="4" fill="#2a3552"/>
        </g>
      </g>

      <g id="flashes"></g>

      <!-- floodlight bloom + flares (incl. mirrored edge copies) -->
      <g id="lamps" style="mix-blend-mode:screen"></g>

      <!-- scoreboard: LED scanlines + glowing lettering -->
      <rect x="958" y="96" width="836" height="314" fill="url(#scan)"/>
      <use href="#eq" filter="url(#ledBlur)" opacity=".55"/>
      <g font-family="Arial Rounded MT Bold, Arial Black, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="900" stroke-linejoin="round" paint-order="stroke">
        <text x="1140" y="183" font-size="84" text-anchor="middle" stroke="#0d1424" stroke-width="10"><tspan id="sbNow" fill="url(#gGold)">3</tspan><tspan fill="#fff"> / 10</tspan></text>
        <text x="1572" y="183" font-size="76" text-anchor="middle" stroke="#0d1424" stroke-width="10"><tspan fill="#fff">SCORE: </tspan><tspan id="sbScore" fill="url(#gGold)">2골</tspan></text>
        <text id="eqShadow" x="1375" y="388" font-size="172" text-anchor="middle" fill="#6b3600" stroke="#6b3600" stroke-width="16" transform="translate(0 12)">27 + 15 = ?</text>
        <text id="eq" x="1375" y="388" font-size="172" text-anchor="middle" fill="url(#gGold)" stroke="#6b3600" stroke-width="14">27 + 15 = ?</text>
      </g>

      <g id="badges"></g>
      <g id="fx"></g>

      <ellipse id="kShadow" cx="1498" cy="1114" rx="165" ry="22" fill="#0b2a05" opacity=".38" filter="url(#soft)"/>
      <g id="kGhosts"></g>
      <g id="keeper">
        <g id="rig">
          <use href="#kBodyImg"/>
          <g id="face" transform="translate(1323 685)"></g>
          <g id="armL"><circle cx="1428.5" cy="901" r="8.5" fill="#8a6c52"/><use href="#kArmLImg"/></g>
          <g id="armR"><circle cx="1576.5" cy="909" r="8.5" fill="#dca07c"/><use href="#kArmRImg"/></g>
        </g>
      </g>

      <ellipse id="bShadow" cx="1352" cy="1450" rx="110" ry="22" fill="#0b2a05" opacity=".42" filter="url(#soft)"/>
      <g id="trail"></g>
      <g id="ball" transform="translate(1375.5 1340)"><g id="ballSpin"><use href="#ballImg"/></g><circle r="114" fill="url(#ballShade)"/></g>
      <g id="fxTop"></g>

      <g id="confetti"></g>
      <g id="msg" opacity="0" font-family="Arial Rounded MT Bold, Arial Black, Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="900" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
        <text id="msgShadow" x="0" y="0" font-size="210" fill="#6b3600" stroke="#6b3600" stroke-width="22" transform="translate(0 16)">골인!</text>
        <text id="msgMain" x="0" y="0" font-size="210" fill="url(#gGold)" stroke="#6b3600" stroke-width="20">골인!</text>
        <text id="msgSub" x="0" y="118" font-size="78" fill="#fff" stroke="#14203a" stroke-width="16">정확한 슛이에요!</text>
      </g>
    </g>
  </svg>
 </div>

  <div class="vig" aria-hidden="true"></div>
  <button type="button" class="hud" id="soundBtn" aria-pressed="true" aria-label="소리 켜짐">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"/><g class="on" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g><g class="off" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M16 9l6 6M22 9l-6 6"/></g></svg>
  </button>
  <div class="hud" id="timer" role="timer" aria-label="남은 시간">
    <svg viewBox="0 0 80 80" aria-hidden="true"><circle class="track" cx="40" cy="40" r="34"/><circle id="ring" cx="40" cy="40" r="34"/></svg>
    <span id="tNum" class="o3d">20</span>
    <span class="cap">TIME</span>
  </div>
</div>

<div id="pads">
  <button type="button" class="pad" id="p-lt" data-zone="lt"><span class="n o3d">28</span><span class="tag">왼쪽 위</span></button>
  <button type="button" class="pad" id="p-c" data-zone="c"><span class="n o3d">42</span><span class="tag">가운데</span></button>
  <button type="button" class="pad" id="p-rt" data-zone="rt"><span class="n o3d">39</span><span class="tag">오른쪽 위</span></button>
  <button type="button" class="pad" id="p-lb" data-zone="lb"><span class="n o3d">45</span><span class="tag">왼쪽 아래</span></button>
  <button type="button" class="pad" id="p-rb" data-zone="rb"><span class="n o3d">51</span><span class="tag">오른쪽 아래</span></button>
</div>

<div class="overlay" id="intro">
  <div class="panel">
    <svg class="ballIcon" viewBox="-118 -118 236 236" aria-hidden="true"><use href="#ballImg"/></svg>
    <h1 class="o3d">수학 승부차기</h1>
    <hr>
    <p class="rule">정답 숫자를 눌러 슛! 한 문제에 <b>20초</b>, 모두 <b>10번</b> 차요.<br>난이도를 고르면 바로 시작해요.</p>
    <div class="levels">
      <button type="button" class="lvl" data-level="mid"><span class="t o3d">중학년</span><span class="g">3~4학년</span><span class="d">두 자리 수 덧셈·뺄셈<br>구구단</span></button>
      <button type="button" class="lvl high" data-level="high"><span class="t o3d">고학년</span><span class="g">5~6학년</span><span class="d">혼합 계산 · 곱셈 · 나눗셈<br>소수의 덧셈·뺄셈</span></button>
    </div>
  </div>
</div>

<div class="overlay" id="result" hidden>
  <div class="panel">
    <div class="final o3d" id="resScore">8골 성공!</div>
    <div class="shots" id="resShots"></div>
    <hr>
    <p class="praise" id="resMsg"></p>
    <div class="btnrow">
      <button type="button" class="bigbtn" id="againBtn">다시 도전하기</button>
      <button type="button" class="subbtn" id="levelBtn">난이도 바꾸기</button>
    </div>
  </div>
</div>

<div id="ceremony" hidden>
  <div class="rays"></div>
  <div class="spot l"></div><div class="spot r"></div>
  <canvas id="cfx"></canvas>
  <div class="cer">
    <div class="trophy">
      <svg class="cup" viewBox="0 0 300 380" role="img" aria-label="황금 트로피">
        <defs>
          <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a6200"/><stop offset=".16" stop-color="#ffd447"/><stop offset=".33" stop-color="#fff6c2"/><stop offset=".5" stop-color="#ffd23f"/><stop offset=".78" stop-color="#e09e00"/><stop offset="1" stop-color="#8a5600"/></linearGradient>
          <linearGradient id="tgIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4a00"/><stop offset="1" stop-color="#c88a00"/></linearGradient>
          <linearGradient id="tBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3f6b"/><stop offset="1" stop-color="#121a33"/></linearGradient>
          <linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <radialGradient id="starG" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe680"/></radialGradient>
          <clipPath id="cupClip"><path d="M58 40 Q150 28 242 40 L234 72 Q228 152 170 186 L130 186 Q72 152 66 72 Z"/><path d="M128 186 H172 L162 226 H138 Z"/><rect x="96" y="262" width="108" height="16" rx="4"/></clipPath>
        </defs>
        <path d="M70 60 C14 54 12 140 84 150" fill="none" stroke="#8a5600" stroke-width="20" stroke-linecap="round"/>
        <path d="M70 60 C14 54 12 140 84 150" fill="none" stroke="url(#tg)" stroke-width="13" stroke-linecap="round"/>
        <path d="M230 60 C286 54 288 140 216 150" fill="none" stroke="#8a5600" stroke-width="20" stroke-linecap="round"/>
        <path d="M230 60 C286 54 288 140 216 150" fill="none" stroke="url(#tg)" stroke-width="13" stroke-linecap="round"/>
        <path d="M58 40 Q150 28 242 40 L234 72 Q228 152 170 186 L130 186 Q72 152 66 72 Z" fill="url(#tg)" stroke="#7a4a00" stroke-width="3"/>
        <ellipse cx="150" cy="38" rx="92" ry="13" fill="url(#tgIn)" stroke="#fff1a8" stroke-width="3"/>
        <path d="M150 78 l11 23 25 3 -18 17 5 25 -23 -12 -23 12 5 -25 -18 -17 25 -3z" fill="url(#starG)" stroke="#c98a00" stroke-width="3" stroke-linejoin="round"/>
        <path d="M128 186 H172 L162 226 H138 Z" fill="url(#tg)" stroke="#7a4a00" stroke-width="3"/>
        <ellipse cx="150" cy="230" rx="30" ry="10" fill="url(#tg)" stroke="#7a4a00" stroke-width="3"/>
        <path d="M140 238 H160 L176 264 H124 Z" fill="url(#tg)" stroke="#7a4a00" stroke-width="3"/>
        <rect x="96" y="262" width="108" height="16" rx="4" fill="url(#tg)" stroke="#7a4a00" stroke-width="3"/>
        <rect x="80" y="276" width="140" height="62" rx="8" fill="url(#tBase)" stroke="#0b1122" stroke-width="3"/>
        <rect x="102" y="290" width="96" height="34" rx="5" fill="url(#tg)" stroke="#7a4a00" stroke-width="2"/>
        <text x="150" y="313" text-anchor="middle" font-family="Arial Black, Arial Rounded MT Bold, sans-serif" font-weight="900" font-size="17" fill="#5a3500">10 / 10</text>
        <rect x="70" y="336" width="160" height="18" rx="5" fill="url(#tg)" stroke="#7a4a00" stroke-width="3"/>
        <g clip-path="url(#cupClip)"><rect class="shine" x="-120" y="0" width="70" height="380" fill="url(#shineG)" transform="skewX(-18)"/></g>
      </svg>
      <svg class="spark" style="left:-4%;top:8%;animation-delay:.2s" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-10Q1-1 10 0Q1 1 0 10Q-1 1-10 0Q-1-1 0-10z" fill="#fff6b0"/></svg>
      <svg class="spark" style="right:-6%;top:22%;animation-delay:.7s" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-10Q1-1 10 0Q1 1 0 10Q-1 1-10 0Q-1-1 0-10z" fill="#ffffff"/></svg>
      <svg class="spark" style="left:12%;top:-6%;animation-delay:1.1s" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-10Q1-1 10 0Q1 1 0 10Q-1 1-10 0Q-1-1 0-10z" fill="#ffe680"/></svg>
      <svg class="spark" style="right:10%;top:52%;animation-delay:.45s" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-10Q1-1 10 0Q1 1 0 10Q-1 1-10 0Q-1-1 0-10z" fill="#fff6b0"/></svg>
    </div>
    <div class="ttl o3d">트로피 획득!</div>
    <div class="award">수학 발롱도르 수상! <b>완벽한 스트라이커!</b></div>
    <div class="lvlTag" id="cerLevel">고학년 · 10골 / 10골</div>
    <div class="shots" id="cerShots"></div>
    <div class="btnrow">
      <button type="button" class="bigbtn" id="cerAgain">다시 도전하기</button>
      <button type="button" class="subbtn" id="cerLevelBtn">난이도 바꾸기</button>
    </div>
  </div>
</div>
<script src="js/seat-masks.js"></script>
<script src="js/game.js"></script>
</body>
</html>
